<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="450" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&amp;family=Outfit:wght@700;800&amp;display=swap');
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px; fill: #ffffff; }
      .lang-name { font-family: 'Fira Code', monospace; font-size: 13px; fill: #cbd5e1; }
      .lang-pct { font-family: 'Fira Code', monospace; font-size: 13px; fill: #94a3b8; font-weight: 600; }
      
      @keyframes growBar {
        from { width: 0; }
      }
      .bar-js { animation: growBar 1.2s ease-out forwards; }
      .bar-react { animation: growBar 1.5s ease-out forwards; }
      .bar-node { animation: growBar 1.8s ease-out forwards; }
      .bar-html { animation: growBar 2.0s ease-out forwards; }
    </style>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="450" height="200" rx="16" fill="url(#cardBg)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5" />
  
  <!-- Header -->
  <text x="25" y="38" class="title">🚀 MOST USED LANGUAGES</text>
  <line x1="25" y1="52" x2="425" y2="52" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <g transform="translate(25, 75)">
    <!-- JavaScript -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="lang-name">JavaScript</text>
      <text x="395" y="0" text-anchor="end" class="lang-pct">48%</text>
      <rect x="0" y="10" width="395" height="8" rx="4" fill="#1e293b" />
      <rect x="0" y="10" width="190" height="8" rx="4" fill="#f59e0b" class="bar-js" />
    </g>

    <!-- React / JSX -->
    <g transform="translate(0, 32)">
      <text x="0" y="0" class="lang-name">React / JSX</text>
      <text x="395" y="0" text-anchor="end" class="lang-pct">32%</text>
      <rect x="0" y="10" width="395" height="8" rx="4" fill="#1e293b" />
      <rect x="0" y="10" width="126" height="8" rx="4" fill="#38bdf8" class="bar-react" />
    </g>

    <!-- Node.js / Express -->
    <g transform="translate(0, 64)">
      <text x="0" y="0" class="lang-name">Node.js / Express</text>
      <text x="395" y="0" text-anchor="end" class="lang-pct">12%</text>
      <rect x="0" y="10" width="395" height="8" rx="4" fill="#1e293b" />
      <rect x="0" y="10" width="48" height="8" rx="4" fill="#22c55e" class="bar-node" />
    </g>

    <!-- HTML / CSS -->
    <g transform="translate(0, 96)">
      <text x="0" y="0" class="lang-name">HTML5 / CSS3</text>
      <text x="395" y="0" text-anchor="end" class="lang-pct">8%</text>
      <rect x="0" y="10" width="395" height="8" rx="4" fill="#1e293b" />
      <rect x="0" y="10" width="32" height="8" rx="4" fill="#ec4899" class="bar-html" />
    </g>
  </g>
</svg>