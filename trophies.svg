<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&amp;family=Outfit:wght@800&amp;display=swap');
      .trophy-title { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; }
      .trophy-desc { font-family: 'Fira Code', monospace; font-size: 11px; fill: #94a3b8; }
      .trophy-icon { font-size: 32px; }
      
      @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .trophy-card { animation: popIn 0.6s ease-out forwards; }
    </style>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <!-- Trophy 1 -->
  <g class="trophy-card" transform="translate(0, 0)">
    <rect width="210" height="160" rx="14" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="105" y="55" text-anchor="middle" class="trophy-icon">🏆</text>
    <text x="105" y="95" text-anchor="middle" class="trophy-title">Commit Master</text>
    <text x="105" y="120" text-anchor="middle" class="trophy-desc">1000+ Commits</text>
  </g>

  <!-- Trophy 2 -->
  <g class="trophy-card" transform="translate(230, 0)">
    <rect width="210" height="160" rx="14" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="105" y="55" text-anchor="middle" class="trophy-icon">⚛️</text>
    <text x="105" y="95" text-anchor="middle" class="trophy-title">React Craftsman</text>
    <text x="105" y="120" text-anchor="middle" class="trophy-desc">Component Master</text>
  </g>

  <!-- Trophy 3 -->
  <g class="trophy-card" transform="translate(460, 0)">
    <rect width="210" height="160" rx="14" fill="url(#cardBg)" stroke="#ec4899" stroke-width="1.5" />
    <text x="105" y="55" text-anchor="middle" class="trophy-icon">🚀</text>
    <text x="105" y="95" text-anchor="middle" class="trophy-title">Full-Stack Architect</text>
    <text x="105" y="120" text-anchor="middle" class="trophy-desc">Node &amp; Express APIs</text>
  </g>

  <!-- Trophy 4 -->
  <g class="trophy-card" transform="translate(690, 0)">
    <rect width="210" height="160" rx="14" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.5" />
    <text x="105" y="55" text-anchor="middle" class="trophy-icon">🌟</text>
    <text x="105" y="95" text-anchor="middle" class="trophy-title">Open Source Star</text>
    <text x="105" y="120" text-anchor="middle" class="trophy-desc">Consistent Creator</text>
  </g>
</svg>