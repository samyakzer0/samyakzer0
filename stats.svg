<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="450" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&amp;family=Outfit:wght@700;800&amp;display=swap');
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px; fill: #ffffff; }
      .label { font-family: 'Fira Code', monospace; font-size: 13px; fill: #94a3b8; }
      .value { font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 600; fill: #f472b6; }
      .rank-text { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 28px; fill: #ec4899; }
      
      @keyframes dash {
        to { stroke-dashoffset: 40; }
      }
      .circle-chart {
        animation: dash 2.5s ease-out forwards;
      }
    </style>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="450" height="200" rx="16" fill="url(#cardBg)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.5" />
  
  <!-- Header -->
  <text x="25" y="38" class="title">⚡ SAMYAK'S STATS</text>
  <line x1="25" y1="52" x2="425" y2="52" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Rank Ring -->
  <g transform="translate(350, 125)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="8" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ec4899" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="200" transform="rotate(-90)" class="circle-chart" />
    <text x="0" y="10" text-anchor="middle" class="rank-text">A+</text>
  </g>

  <!-- Stat Rows -->
  <g transform="translate(25, 80)">
    <text x="0" y="0" class="label">Total Commits (2026):</text>
    <text x="200" y="0" class="value">1,482</text>

    <text x="0" y="30" class="label">Pull Requests:</text>
    <text x="200" y="30" class="value">164</text>

    <text x="0" y="60" class="label">Total Stars Earned:</text>
    <text x="200" y="60" class="value">320+</text>

    <text x="0" y="90" class="label">Contributed To:</text>
    <text x="200" y="90" class="value">24 Repos</text>
  </g>
</svg>